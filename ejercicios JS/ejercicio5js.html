<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let color = prompt("Ingrese un color del semaforo");
        switch (color) {
            case "Rojo": 
            alert("Accion: Detenerse inmediatamente.");
            break;

            case "Amarillo":
            alert("Accion: preparese para avanzar")
            break;

            case "verde":
            alert("Accion: avance")
            break;
             

           default:
           alert("no es un color del semaforo") 
        }
    </script>
</body>
</html>
