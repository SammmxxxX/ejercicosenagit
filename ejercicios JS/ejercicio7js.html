<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let mes = parseInt(prompt("Ingrese un numero del 1 al 12"));
        let año = parseInt(prompt("ingrese el año"));

        switch (mes) {
            case 1: 
            case 3: 
            case 5: 
            case 7: 
            case 8: 
            case 10: 
            case 12: 
            alert("El mes Tiene 31 dias.");
            break;
            
            case 4: 
            case 6: 
            case 9: 
            case 11: 
            alert("El mes Tiene 30 dias.");
            break;

            case 2:  
            if (año%4==0){

                alert(" el mes tiene 29 dias ");

            } else{

                alert(" el mes tiene 28 dias ");
            }
            break;


            default: 
            alert("Mes no valido.");
            break;
        }
    </script>
</body>
</html>
