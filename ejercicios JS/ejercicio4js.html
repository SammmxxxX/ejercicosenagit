<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let opcion = parseInt(prompt("1.Hamburguesa\n2. Pizza\n3. Perro Caliente\n4. Ensalada"));
        switch (opcion) {
            case 1:
            alert("Seleccionaste Hamburguesa.\nTotal a pagar: $15.000");
            break;

            case 2:
            alert("Seleccionaste pizza.\nTotal a pagar: $12.000");
            break;

            case 3: 
            alert("Seleccionaste Perro Caliente.\nTotal a pagar: $10.000");
            break;

            case 4: 
            alert("Seleccionaste Ensalada.\nTotal a pagar: $8.000");
            break;

            default: 
            alert("Opcion no valida");
            break;
        }
    </script>
</body>
</html>
